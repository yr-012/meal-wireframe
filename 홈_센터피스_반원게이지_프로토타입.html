<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>홈 센터피스 프로토타입 - 반원 프로그레스 게이지</title>
<style>
:root {
  --bg: #FFF3EC;
  --surface: #FFFFFF;
  --primary: #FF8A3D;
  --text: #23233A;
  --text-muted: #8A8A99;
  --badge-mint-bg: #D9F2E6; --badge-mint-fg: #2FAE7C;
  --badge-accent-bg: #FFEADC; --badge-accent-fg: #FF8A3D;
  --gauge-empty: #F5DFCB;
  --gauge-tick: #E8D3BC;
  --shadow: 0 4px 16px rgba(120, 80, 40, 0.10);
  --radius-card: 20px;
  --radius-pill: 999px;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin:0; height:100%; }
body {
  font-family: var(--font);
  background:#14142b;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh;
  gap:28px;
  padding:24px;
  flex-wrap:wrap;
}
.stage { display:flex; align-items:center; gap:28px; }
.device {
  width:390px; height:844px;
  background:var(--bg);
  border-radius:44px;
  overflow:hidden;
  position:relative;
  box-shadow:0 24px 64px rgba(0,0,0,0.45);
  border:8px solid #0b0b18;
  flex-shrink:0;
}
.device-content { position:absolute; inset:0; padding:24px 24px 90px; overflow-y:auto; }
.badge-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.badge { font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px; }
.delzua-msg { text-align:center; margin:10px 0 0; }
.delzua-msg span {
  display:inline-flex; align-items:center; gap:6px;
  background:var(--badge-mint-bg); color:var(--badge-mint-fg);
  font-size:13px; font-weight:700; padding:6px 14px; border-radius:999px;
}
.gauge-card {
  background:var(--surface); border-radius:var(--radius-card); box-shadow:var(--shadow);
  padding:14px 16px 16px; margin-top:4px;
}
.gauge-wrap { display:flex; justify-content:center; }
.remaining-label { text-align:center; font-size:13px; font-weight:700; color:var(--primary); margin-bottom:2px; }
.reading-value { text-align:center; font-size:28px; font-weight:800; color:var(--text); }
.reading-value span { font-size:14px; font-weight:700; color:var(--text-muted); }
.headline { font-size:16px; font-weight:800; color:var(--text); margin:14px 0 4px; }
.subtext { font-size:13px; color:var(--text-muted); text-align:center; }
.top-row { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.month-label { margin:0; text-align:left; background:none; border:none; font-size:16px; font-weight:700; color:var(--text); padding:4px; }
.today-btn { margin:0; background:var(--badge-accent-bg); color:var(--badge-accent-fg); font-size:12px; font-weight:700; padding:6px 12px; border:none; border-radius:999px; }
.week-row { display:flex; align-items:center; gap:4px; margin-bottom:8px; }
.week-arrow { background:none; border:none; color:var(--primary); font-size:14px; flex:none; padding:4px; }
.week-bar { display:flex; justify-content:center; gap:2px; flex:1; min-width:0; }
.day-cell { display:flex; flex-direction:column; align-items:center; gap:4px; width:36px; flex:none; }
.day-label { font-size:11px; color:var(--text-muted); }
.day-circle { position:relative; width:34px; height:34px; border-radius:50%; box-sizing:border-box; }
.day-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--text); }

.btn-primary {
  width:100%; padding:16px; border:none; border-radius:var(--radius-pill);
  background:var(--primary); color:#fff; font-size:16px; font-weight:700;
  cursor:pointer; margin-top:8px;
}
.tabbar {
  position:absolute; left:0; right:0; bottom:0;
  height:76px; padding-bottom:12px;
  background:#fff; border-top:1px solid #ECECF3;
  display:flex; align-items:center; justify-content:space-around;
}
.tab-item { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--text-muted); }
.tab-item.active { color:var(--primary); font-weight:700; }
.tab-icon { font-size:20px; }

.controls { width:280px; background:#1e1e38; border-radius:20px; padding:20px 24px; color:#fff; flex-shrink:0; }
.controls h3 { margin:0 0 12px; font-size:15px; font-weight:700; }
.controls label { font-size:13px; color:#cfcfe8; display:block; margin-bottom:6px; }
.controls input[type="range"] { width:100%; }
.preset-row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.preset-row button {
  flex:1; min-width:60px; padding:8px; border-radius:10px; border:none; cursor:pointer;
  background:#33335a; color:#fff; font-size:12px; font-weight:700;
}
.preset-row button:hover { background:var(--primary); }
.pct-readout { text-align:right; font-size:13px; color:#cfcfe8; margin-top:4px; }

.confetti-layer { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:30; }
.confetti-piece {
  position:absolute; border-radius:2px;
  animation: confetti-burst 1.1s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes confetti-burst {
  0% { transform: translate(0,0) rotate(0deg); opacity:1; }
  100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity:0; }
}
.glow-ring {
  position:absolute; width:20px; height:20px; border-radius:50%;
  border:3px solid var(--primary); transform:translate(-50%,-50%) scale(0.4);
  pointer-events:none; z-index:25;
  animation: glow-pulse 0.9s ease-out forwards;
}
@keyframes glow-pulse {
  0% { transform:translate(-50%,-50%) scale(0.4); opacity:0.9; }
  100% { transform:translate(-50%,-50%) scale(var(--end-scale, 9)); opacity:0; }
}

/* 100% 달성 시 뜨는 별도 화면 (레이아웃: 100달성.png, 등장 모션: 무디_성공 인터랙션.mp4 참고 —
   시트가 아래에서 위로 슬라이드업 되면서 동시에 컨페티가 터짐) */
.achievement-screen {
  position:absolute; inset:0; z-index:50;
  background:rgba(255, 243, 236, 0.86); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
  display:none; flex-direction:column; align-items:center; justify-content:center;
  padding:40px 28px; text-align:center;
  transform:translateY(100%);
}
.achievement-screen.visible { display:flex; animation: achv-slide-up 0.45s cubic-bezier(.22,.9,.35,1) forwards; }
@keyframes achv-slide-up {
  from { transform:translateY(100%); }
  to { transform:translateY(0); }
}
.achv-close {
  position:absolute; top:20px; left:20px; background:none; border:none;
  font-size:18px; color:var(--text-muted); cursor:pointer; padding:6px; z-index:2;
}
.achv-confetti-layer { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.achv-confetti-piece {
  position:absolute; top:-12px; border-radius:2px;
  animation-name: achv-confetti-fall; animation-timing-function: linear; animation-fill-mode: forwards;
}
@keyframes achv-confetti-fall {
  0% { transform: translateY(0) rotate(0deg); opacity:1; }
  85% { opacity:1; }
  100% { transform: translateY(var(--fall-y)) rotate(var(--fall-rot)); opacity:0; }
}
.achv-ring-wrap { position:relative; width:160px; height:160px; margin-bottom:22px; }
.achv-ring { width:100%; height:100%; }
.achv-check {
  position:absolute; top:-6px; left:50%; transform:translateX(-50%); z-index:2;
  width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800;
  box-shadow:0 4px 10px rgba(255,138,61,0.4);
}
.achv-pct-text { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.achv-pct { font-size:36px; font-weight:800; color:var(--text); }
.achv-sub { font-size:13px; color:var(--text-muted); margin-top:2px; }
.achv-badge {
  background:var(--badge-accent-bg); color:var(--badge-accent-fg); font-size:14px; font-weight:700;
  padding:8px 18px; border-radius:999px; margin-bottom:22px;
}
.achv-headline { font-size:21px; font-weight:800; color:var(--text); margin-bottom:8px; }
.achv-subtext { font-size:14px; color:var(--text-muted); max-width:260px; line-height:1.5; }
.achv-confirm { position:absolute; left:24px; right:24px; bottom:36px; width:auto; }
</style>
</head>
<body>

<div class="stage">
  <div class="device">
    <div class="device-content">
      <div class="top-row">
        <button class="month-label">2026년 8월 ∨</button>
        <button class="today-btn">오늘</button>
      </div>
      <div class="week-row">
        <button class="week-arrow">◀</button>
        <div class="week-bar" id="week-bar"></div>
        <button class="week-arrow">▶</button>
      </div>

      <div class="gauge-card">
        <div class="gauge-wrap">
          <svg id="gauge-svg" width="300" height="135" viewBox="0 0 300 135"></svg>
        </div>
        <div class="remaining-label" id="remaining-label">120g 남음</div>
        <div class="reading-value"><span id="now-g">0</span><span>g / <span id="goal-g">120</span>g</span></div>
        <div class="delzua-msg">
          <span id="delzua-msg">🍜 델쥬아 2봉이면 목표 달성까지 가까워져요!</span>
        </div>
      </div>

      <div class="headline">오늘의 식단</div>
      <div class="subtext" style="text-align:left; margin-bottom:12px;">아직 기록한 끼니가 없어요.</div>
      <button class="btn-primary">+ 기록하기</button>
    </div>

    <div class="tabbar">
      <div class="tab-item active"><span class="tab-icon">🏠</span>홈</div>
      <div class="tab-item"><span class="tab-icon">📊</span>분석</div>
      <div class="tab-item"><span class="tab-icon">🍳</span>레시피</div>
      <div class="tab-item"><span class="tab-icon">👤</span>마이페이지</div>
    </div>

    <div class="flash-overlay" id="flash-overlay"></div>
    <div class="confetti-layer" id="confetti-layer"></div>

    <div class="achievement-screen" id="achievement-screen">
      <button class="achv-close" id="achv-close">✕</button>
      <div class="achv-confetti-layer" id="achv-confetti-layer"></div>
      <div class="achv-ring-wrap">
        <div class="achv-check">✓</div>
        <svg class="achv-ring" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="var(--gauge-empty)" stroke-width="10" />
          <circle cx="60" cy="60" r="52" fill="none" stroke="var(--primary)" stroke-width="10" stroke-linecap="round"
                  stroke-dasharray="326.7" stroke-dashoffset="0" transform="rotate(-90 60 60)" />
        </svg>
        <div class="achv-pct-text">
          <div class="achv-pct">100%</div>
          <div class="achv-sub" id="achv-sub">120 / 120g</div>
        </div>
      </div>
      <div class="achv-badge">🎉 오늘의 목표 달성</div>
      <div class="achv-headline">오늘도 완벽해요!</div>
      <div class="achv-subtext">델쥬아와 함께 오늘 단백질 목표를 모두 채웠어요!</div>
      <button class="btn-primary achv-confirm" id="achv-confirm">확인</button>
    </div>
  </div>

  <div class="controls">
    <h3>🧪 테스트 컨트롤 (실제 화면에는 없음)</h3>
    <label for="pct-slider">오늘 목표 대비 섭취율</label>
    <input type="range" id="pct-slider" min="0" max="130" value="0" step="1" />
    <div class="pct-readout" id="pct-readout">0%</div>
    <div class="preset-row">
      <button data-pct="0">0%</button>
      <button data-pct="25">25%</button>
      <button data-pct="50">50%</button>
      <button data-pct="75">75%</button>
      <button data-pct="100">100%</button>
      <button data-pct="130">130%</button>
    </div>
  </div>
</div>

<script>
const GOAL = 120; // g, 테스트용 임의 목표
const DELZUA_PACK = 33.6;
const BAR_COUNT = 7;
const CENTER_X = 150, CENTER_Y = 125;
const INNER_R = 60, BAR_LEN = 60;
const DAY_LABELS = ['일', '월', '화', '수', '목', '금', '토'];
const WEEK_DAYS = [
  { date: 2, pct: 62 }, { date: 3, pct: 88 }, { date: 4, pct: 45 },
  { date: 5, pct: 0, isToday: false }, { date: 6, pct: 40, isToday: true, isSelected: true },
  { date: 7, pct: 0 }, { date: 8, pct: 0 }
];

const svg = document.getElementById('gauge-svg');
const nowG = document.getElementById('now-g');
const goalG = document.getElementById('goal-g');
const remainingLabel = document.getElementById('remaining-label');
const delzuaMsg = document.getElementById('delzua-msg');
const slider = document.getElementById('pct-slider');
const readout = document.getElementById('pct-readout');
const deviceEl = document.querySelector('.device');
const flashOverlay = document.getElementById('flash-overlay');
const confettiLayer = document.getElementById('confetti-layer');
const CONFETTI_COLORS = ['#FF8A3D', '#FFC495', '#2FAE7C', '#3B9FE0', '#FFD166', '#FF6B6B'];
let wasGoalReached = false;
let lastFeedbackPct = 0;
let lastFeedbackTime = 0;

function getGaugeCenterInDevice() {
  const svgRect = svg.getBoundingClientRect();
  const deviceRect = deviceEl.getBoundingClientRect();
  return {
    x: svgRect.left - deviceRect.left + svgRect.width * (CENTER_X / 300),
    y: svgRect.top - deviceRect.top + svgRect.height * (CENTER_Y / 135)
  };
}

function spawnConfetti(x, y, count) {
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    const angle = Math.random() * Math.PI * 2;
    const distance = 40 + Math.random() * 100;
    const tx = Math.cos(angle) * distance;
    const ty = Math.sin(angle) * distance - 30;
    const rot = Math.round(Math.random() * 720 - 360) + 'deg';
    const w = 5 + Math.random() * 6;
    const h = w * 0.6;
    const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    el.className = 'confetti-piece';
    el.style.cssText = 'left:' + x + 'px; top:' + y + 'px; width:' + w.toFixed(1) + 'px; height:' + h.toFixed(1) + 'px; background:' + color + ';' +
      '--tx:' + tx.toFixed(1) + 'px; --ty:' + (ty + 170).toFixed(1) + 'px; --rot:' + rot + '; animation-delay:' + (Math.random() * 0.12).toFixed(2) + 's;';
    confettiLayer.appendChild(el);
    el.addEventListener('animationend', function () { el.remove(); });
  }
}

function spawnGlowRing(x, y, endScale) {
  const ring = document.createElement('div');
  ring.className = 'glow-ring';
  ring.style.left = x + 'px';
  ring.style.top = y + 'px';
  ring.style.setProperty('--end-scale', endScale);
  deviceEl.appendChild(ring);
  ring.addEventListener('animationend', function () { ring.remove(); });
}

const achvScreen = document.getElementById('achievement-screen');
const achvConfettiLayer = document.getElementById('achv-confetti-layer');
const achvSub = document.getElementById('achv-sub');

// 레퍼런스(100달성.png)처럼 화면 전체에 색종이가 위에서부터 떨어지는 연출
function spawnFullScreenConfetti() {
  const w = deviceEl.clientWidth;
  for (let i = 0; i < 46; i++) {
    const el = document.createElement('div');
    const x = Math.random() * w;
    const fallY = 480 + Math.random() * 260;
    const fallRot = Math.round(Math.random() * 720 - 360) + 'deg';
    const size = 6 + Math.random() * 6;
    const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    const duration = (2 + Math.random() * 1.5).toFixed(2);
    const delay = (Math.random() * 0.6).toFixed(2);
    el.className = 'achv-confetti-piece';
    el.style.cssText = 'left:' + x.toFixed(1) + 'px; width:' + size.toFixed(1) + 'px; height:' + (size * 0.6).toFixed(1) + 'px; background:' + color + ';' +
      '--fall-y:' + fallY.toFixed(0) + 'px; --fall-rot:' + fallRot + '; animation-duration:' + duration + 's; animation-delay:' + delay + 's;';
    achvConfettiLayer.appendChild(el);
    el.addEventListener('animationend', function () { el.remove(); });
  }
}

function showAchievementScreen() {
  achvSub.textContent = GOAL + ' / ' + GOAL + 'g';
  achvConfettiLayer.innerHTML = '';
  spawnFullScreenConfetti();
  achvScreen.classList.add('visible');
}

function hideAchievementScreen() {
  achvScreen.classList.remove('visible');
}

document.getElementById('achv-close').onclick = hideAchievementScreen;
document.getElementById('achv-confirm').onclick = hideAchievementScreen;

// intensity: 'big' (목표 100% 달성 순간 → 별도 달성 화면) | 'small' (기록할 때마다 즉각 피드백)
function celebrate(intensity) {
  if (intensity === 'big') {
    showAchievementScreen();
    return;
  }
  const center = getGaugeCenterInDevice();
  spawnConfetti(center.x, center.y, 10);
  spawnGlowRing(center.x, center.y, 3.5);
}

// 100%까지 안 가더라도, 기록량이 늘어날 때마다 작은 피드백을 줌 (드래그 중 과도한 연발은 살짝 스로틀)
function maybeCelebrate(clamped, goalReached) {
  const now = Date.now();
  if (goalReached && !wasGoalReached) {
    celebrate('big');
    lastFeedbackTime = now;
  } else if (clamped > lastFeedbackPct && (now - lastFeedbackTime > 350)) {
    celebrate('small');
    lastFeedbackTime = now;
  }
  wasGoalReached = goalReached;
  lastFeedbackPct = clamped;
}

goalG.textContent = GOAL;

function renderWeekBar() {
  const bar = document.getElementById('week-bar');
  const size = 34, radius = 13, strokeWidth = 3;
  const circumference = 2 * Math.PI * radius;
  bar.innerHTML = WEEK_DAYS.map(function (d, i) {
    const offset = circumference * (1 - d.pct / 100);
    const circleStyle = (d.isSelected ? 'background:var(--badge-accent-bg);' : '') +
      (d.isToday && !d.isSelected ? 'box-shadow:0 0 0 2px var(--primary) inset;' : '');
    return '<div class="day-cell">' +
      '<div class="day-label">' + DAY_LABELS[i] + '</div>' +
      '<div class="day-circle" style="' + circleStyle + '">' +
        '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="position:absolute; inset:0;">' +
          '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + radius + '" fill="none" stroke="var(--gauge-empty)" stroke-width="' + strokeWidth + '" />' +
          '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + radius + '" fill="none" stroke="var(--primary)" stroke-width="' + strokeWidth + '" stroke-linecap="round" ' +
            'stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')" />' +
        '</svg>' +
        '<div class="day-num" style="color:' + (d.isSelected ? 'var(--primary)' : 'var(--text)') + ';">' + d.date + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}
renderWeekBar();

function polar(cx, cy, r, angleDeg) {
  const rad = angleDeg * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
}

// 레퍼런스 이미지(반원프로그레스바.png)를 OpenCV로 분석한 결과:
// 각 막대는 균일 두께 선이 아니라 안쪽은 좁고 바깥쪽은 넓어지며 끝이 둥글게 마무리되는 "꽃잎(wedge)" 모양
const INNER_HALF_W = 12, OUTER_HALF_W = 22;

// 사다리꼴(trapezoid): 바깥쪽 끝은 둥근 캡 없이 직선으로 마감
function buildWedgePath(angleDeg) {
  const rad = angleDeg * Math.PI / 180;
  const dir = { x: Math.cos(rad), y: -Math.sin(rad) };
  const perp = { x: -dir.y, y: dir.x };
  const outerR = INNER_R + BAR_LEN;
  const iL = { x: CENTER_X + dir.x * INNER_R - perp.x * INNER_HALF_W, y: CENTER_Y + dir.y * INNER_R - perp.y * INNER_HALF_W };
  const iR = { x: CENTER_X + dir.x * INNER_R + perp.x * INNER_HALF_W, y: CENTER_Y + dir.y * INNER_R + perp.y * INNER_HALF_W };
  const oL = { x: CENTER_X + dir.x * outerR - perp.x * OUTER_HALF_W, y: CENTER_Y + dir.y * outerR - perp.y * OUTER_HALF_W };
  const oR = { x: CENTER_X + dir.x * outerR + perp.x * OUTER_HALF_W, y: CENTER_Y + dir.y * outerR + perp.y * OUTER_HALF_W };
  const f = function (p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); };
  return 'M ' + f(iL) + ' L ' + f(oL) + ' L ' + f(oR) + ' L ' + f(iR) + ' Z';
}

// 눈금(bar 사이 얇은 틱)을 먼저 그리고, 그 위에 꽃잎 모양 바를 그림
function buildGauge(litCount) {
  const outerR = INNER_R + BAR_LEN;
  const innerOffset = (INNER_R / outerR).toFixed(3);
  let html =
    '<defs>' +
      '<filter id="bar-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="300" height="135">' +
        '<feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#FF8A3D" flood-opacity="0.35" />' +
      '</filter>' +
      '<radialGradient id="bar-gradient" gradientUnits="userSpaceOnUse" cx="' + CENTER_X + '" cy="' + CENTER_Y + '" r="' + outerR + '">' +
        '<stop offset="' + innerOffset + '" stop-color="#FFC495" />' +
        '<stop offset="1" stop-color="#FF7A1F" />' +
      '</radialGradient>' +
    '</defs>';
  const tickCount = BAR_COUNT + 1;
  for (let t = 0; t < tickCount; t++) {
    const angle = 180 - t * (180 / (tickCount - 1));
    const p1 = polar(CENTER_X, CENTER_Y, INNER_R - 8, angle);
    const p2 = polar(CENTER_X, CENTER_Y, INNER_R - 14, angle);
    html += '<line x1="' + p1.x.toFixed(1) + '" y1="' + p1.y.toFixed(1) + '" x2="' + p2.x.toFixed(1) + '" y2="' + p2.y.toFixed(1) + '" stroke="var(--gauge-tick)" stroke-width="2" stroke-linecap="round" />';
  }
  for (let i = 0; i < BAR_COUNT; i++) {
    const angle = 180 - i * (180 / (BAR_COUNT - 1));
    const lit = i < litCount;
    const color = lit ? 'url(#bar-gradient)' : 'var(--gauge-empty)';
    const filter = lit ? ' filter="url(#bar-shadow)"' : '';
    html += '<path d="' + buildWedgePath(angle) + '" fill="' + color + '"' + filter + ' />';
  }
  svg.innerHTML = html;
}

function render(pct) {
  const clamped = Math.max(0, Math.min(130, pct));
  const fillPct = Math.min(100, clamped);
  const litCount = Math.round(BAR_COUNT * fillPct / 100);

  buildGauge(litCount);

  const grams = Math.round(GOAL * clamped / 100 * 10) / 10;
  nowG.textContent = grams;

  const remain = Math.max(GOAL - grams, 0);
  remainingLabel.textContent = remain > 0 ? Math.round(remain) + 'g 남음' : '목표 달성!';
  delzuaMsg.textContent = remain > 0
    ? '🍜 델쥬아 ' + Math.ceil(remain / DELZUA_PACK) + '봉이면 목표 달성까지 가까워져요!'
    : '🎉 오늘 단백질 목표를 달성했어요!';

  readout.textContent = clamped + '%';
  slider.value = clamped;

  maybeCelebrate(clamped, clamped >= 100);
}

slider.oninput = function () { render(parseInt(slider.value, 10)); };
document.querySelectorAll('.preset-row button').forEach(function (btn) {
  btn.onclick = function () { render(parseInt(btn.getAttribute('data-pct'), 10)); };
});

render(0);
</script>
